server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Security headers -------------------------------------------------
    # NOTE: nginx only inherits add_header into a location that defines none
    # of its own, so caching below uses `expires` rather than add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # 'unsafe-inline' for styles only — the pages use style="" attributes.
    # No inline <script> anywhere, so script-src stays strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # --- Compression ------------------------------------------------------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # --- Routing ----------------------------------------------------------
    # Clean URLs: /about serves about.html, /about.html still works.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets carry a ?v= cache-buster, so they can cache hard.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires    30d;
        access_log off;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
}
