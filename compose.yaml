services:
  web:
    build:
      context: .
    image: aleya-site:latest
    # Built here, never pushed to a registry — so build it, don't pull it.
    pull_policy: build
    container_name: aleya-site
    restart: unless-stopped
    networks:
      main-router:
        ipv4_address: 10.10.10.13

networks:
  # Created outside this stack, so Docker on the host must already know it and
  # its subnet has to contain 10.10.10.13. On a macvlan network the container
  # holds that address on the LAN directly — no host port mapping is needed,
  # and the site answers on http://10.10.10.13 (port 80).
  main-router:
    external: true
